const joy=document.getElementById("joy"),stick=document.getElementById("stick");let joyOn=false,joyId=null,joyX=0,joyY=0;
function joyMove(e){const r=joy.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),len=Math.hypot(dx0,dy0)||1,rad=38;let dx=dx0,dy=dy0;if(len>rad){dx=dx0/len*rad;dy=dy0/len*rad}joyX=dx/rad;joyY=dy/rad;stick.style.transform="translate("+dx+"px,"+dy+"px)"}
function joyStop(){joyOn=false;joyId=null;joyX=0;joyY=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{joyOn=true;joyId=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{if(joyOn&&e.pointerId===joyId)joyMove(e)});joy.addEventListener("pointerup",joyStop);joy.addEventListener("pointercancel",joyStop);

function getFloorY(x,z){const lz=z+88;if(x>-13.7&&x<-8.1&&lz>-3.2&&lz<3.2)return .03+((3.2-lz)/6.4)*5.25;if((x<-6.5||x>6.5)&&lz>-6.3&&lz<6.3)return 5.45;return .03}
function animate(){
 const dt=Math.min(clock.getDelta(),.035);
 let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joyY,strafe=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joyX;
 const mag=Math.hypot(forward,strafe)||1;if(mag>1){forward/=mag;strafe/=mag}
 const speed=(keys.ShiftLeft||keys.ShiftRight?6.7:3.7)*dt;
 const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
 const dx=(fx*forward+rx*strafe)*speed,dz=(fz*forward+rz*strafe)*speed;
 let moving=!!(dx||dz);
 const nx=avatar.position.x+dx,nz=avatar.position.z+dz;
 if(!blocked(nx,avatar.position.z))avatar.position.x=nx;
 if(!blocked(avatar.position.x,nz))avatar.position.z=nz;
 if(moving){avatar.rotation.y=Math.atan2(dx,dz);const w=Math.sin(performance.now()*.012)*.24;avatar.userData.la.rotation.z=.15+w;avatar.userData.ra.rotation.z=-.15-w;avatar.userData.ll.rotation.x=w*.72;avatar.userData.rl.rotation.x=-w*.72}else{avatar.userData.la.rotation.z=.15;avatar.userData.ra.rotation.z=-.15;avatar.userData.ll.rotation.x=0;avatar.userData.rl.rotation.x=0}
 const floorY=getFloorY(avatar.position.x,avatar.position.z);
 if(keys.Space&&avatar.position.y<=floorY+.05)avatar.userData.vy=6.2;
 avatar.userData.vy=(avatar.userData.vy||0)-17.5*dt;avatar.position.y+=avatar.userData.vy*dt;if(avatar.position.y<floorY){avatar.position.y=floorY;avatar.userData.vy=0}
 const target=new THREE.Vector3(avatar.position.x,avatar.position.y+1.08,avatar.position.z);
 const horiz=camDistance*Math.cos(camPitch),up=camDistance*Math.sin(camPitch);
 const desired=new THREE.Vector3(target.x+Math.sin(camYaw)*horiz,target.y+up,target.z+Math.cos(camYaw)*horiz);
 camera.position.lerp(desired,Math.min(1,dt*9));camera.lookAt(target);

 const now=performance.now()*.001;
 mascot.position.y=1.0+Math.sin(now*1.8)*.08;mascot.rotation.y+=dt*.45;
 const md=Math.hypot(mascot.position.x-avatar.position.x,mascot.position.z-avatar.position.z);
 document.getElementById("speech").classList.toggle("hide",md>13);
 if(md<13)document.getElementById("speechText").innerHTML=nearest?"靠近地標後按 <b>E</b> 互動。":"沿著街道自由探索。靠近地標後按 <b>E</b> 互動；WASD 移動、Space 跳躍。";

 for(const m of movers){if(m.npc){m.obj.position.y=.03+Math.abs(Math.sin(now*1.4+m.phase))*.018;const w=Math.sin(now*1.8+m.phase)*.05;m.obj.userData.la.rotation.z=.15+w;m.obj.userData.ra.rotation.z=-.15-w}else{m.obj.position.x=m.baseX+Math.sin(now*m.speed+m.phase)*2.4;m.obj.position.z=m.baseZ+Math.cos(now*m.speed*.65+m.phase)*1.2;m.obj.rotation.y=Math.atan2(Math.cos(now*m.speed+m.phase),-Math.sin(now*m.speed*.65+m.phase))}}

 nearest=null;let nd=999;
 for(const p of points){const d=Math.hypot(p.x-avatar.position.x,p.z-avatar.position.z);p.marker.scale.setScalar(.86+.12*Math.sin(now*3));if(d<4.6&&d<nd){nearest=p;nd=d}}
 const pr=document.getElementById("prompt");
 if(nearest){pr.textContent="E  進入 · "+nearest.name;pr.classList.add("promptOn")}else pr.classList.remove("promptOn");
 mapUpdate();
 renderer.render(scene,camera)
}
