<style>
:root{--ink:#eee7d5;--muted:#aeb5ba;--gold:#d8b96f;--glass:#10151bd9;--accent:#8fd6c7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Serif TC",sans-serif}
body{user-select:none}
canvas{display:block;touch-action:none;cursor:crosshair}
#brand{position:fixed;z-index:20;top:24px;left:28px;text-shadow:0 4px 25px #000;pointer-events:none;transition:opacity .35s}
#brand h1{margin:0;font:600 29px/1 "Noto Serif TC",serif;letter-spacing:.15em}
#brand p{margin:8px 0 0;font-size:10px;letter-spacing:.18em;color:#bdc1c5;text-transform:uppercase}
#panel{position:fixed;z-index:20;top:22px;right:24px;width:220px;padding:14px 15px;background:linear-gradient(180deg,#10151be8,#080b0fd7);border:1px solid #fff2;box-shadow:0 18px 60px #0008;backdrop-filter:blur(18px);transition:opacity .35s,transform .35s}
#panel.hidden{opacity:0;pointer-events:none;transform:translateY(-10px)}
.kicker{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.title{margin:7px 0 10px;font-size:17px}
.copy{margin:0;color:#b8bdc3;font-size:12px;line-height:1.75}
#timeBtn{width:100%;height:36px;border:1px solid #fff3c6;color:#d8d4c8;background:#101318;cursor:pointer;letter-spacing:.08em;font-size:11px}
#startScreen{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 42%,#1e2d35a8 0%,#06090ddd 70%),#06090d;transition:opacity .55s,visibility .55s}
#startScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.start-card{width:min(560px,92vw);padding:30px 30px 24px;background:linear-gradient(180deg,#111820f0,#0a0e13e8);border:1px solid #ffffff18;box-shadow:0 28px 100px #000b;backdrop-filter:blur(18px)}

.start-card p{margin:0 0 22px;max-width:500px;color:#bac2c7;font-size:14px;line-height:1.9}
#startWorld{width:100%;height:48px;border:1px solid #d2b16d;background:linear-gradient(180deg,#3a3121,#211a10);color:#f6dfaa;cursor:pointer;font-size:13px;letter-spacing:.18em}
.start-controls{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;color:#8f989e;font-size:11px}

.start-controls b{color:#e8d39d}
#hint{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);padding:8px 13px;background:#090c10cf;border:1px solid #fff2;color:#acb3ba;font-size:11px;white-space:nowrap;backdrop-filter:blur(13px);transition:opacity .35s}

@media(max-width:760px){

  #info{bottom:235px;max-width:86vw}
}

  }

  });

  });
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.getElementById("startWorld");
    if(!b)return;

      if(booted)return;

      var p=document.getElementById("panel");

      var h=document.getElementById("hint");
