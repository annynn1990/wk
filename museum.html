<style>
:root{--ink:#eee7d5;--muted:#aeb5ba;--gold:#d8b96f;--glass:#10151bd9;--accent:#8fd6c7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Serif TC",sans-serif}
body{user-select:none}
canvas{display:block;touch-action:none;cursor:crosshair}
#brand{position:fixed;z-index:20;top:24px;left:28px;text-shadow:0 4px 25px #000;pointer-events:none;transition:opacity .35s}
#brand h1{margin:0;font:600 29px/1 "Noto Serif TC",serif;letter-spacing:.15em}
#brand p{margin:8px 0 0;font-size:10px;letter-spacing:.18em;color:#bdc1c5;text-transform:uppercase}
#panel{position:fixed;z-index:20;top:22px;right:24px;width:220px;padding:14px 15px;background:linear-gradient(180deg,#10151be8,#080b0fd7);border:1px solid #fff2;box-shadow:0 18px 60px #0008;backdrop-filter:blur(18px);transition:opacity .35s,transform .35s}
#panel.hidden{opacity:0;pointer-events:none;transform:translateY(-10px)}
.kicker{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.title{margin:7px 0 10px;font-size:17px}
.copy{margin:0;color:#b8bdc3;font-size:12px;line-height:1.75}
#timeBtn{width:100%;height:36px;border:1px solid #fff3c6;color:#d8d4c8;background:#101318;cursor:pointer;letter-spacing:.08em;font-size:11px}
#startScreen{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 42%,#1e2d35a8 0%,#06090ddd 70%),#06090d;transition:opacity .55s,visibility .55s}

.start-card{width:min(560px,92vw);padding:30px 30px 24px;background:linear-gradient(180deg,#111820f0,#0a0e13e8);border:1px solid #ffffff18;box-shadow:0 28px 100px #000b;backdrop-filter:blur(18px)}

.start-card p{margin:0 0 22px;max-width:500px;color:#bac2c7;font-size:14px;line-height:1.9}
#startWorld{width:100%;height:48px;border:1px solid #d2b16d;background:linear-gradient(180deg,#3a3121,#211a10);color:#f6dfaa;cursor:pointer;font-size:13px;letter-spacing:.18em}
.start-controls{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;color:#8f989e;font-size:11px}
.start-controls span{white-space:nowrap}
.start-controls b{color:#e8d39d}

  var booted=false;

    var box=document.getElementById("info");

  }
  window.addEventListener("error",function(e){
    if(e&&e.message)showBootError("JavaScript 啟動失敗： "+e.message);
  });
  window.addEventListener("unhandledrejection",function(e){
    showBootError("模組／資源啟動失敗： "+(e&&e.reason&&e.reason.message?e.reason.message:e.reason||"載入失敗"));
  });
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.getElementById("startWorld");
    if(!b)return;
    b.addEventListener("click",function(){
      if(booted)return;
      booted=true;
      var s=document.getElementById("startScreen");
      if(s)s.classList.add("hidden");
      var p=document.getElementById("panel");
      if(p)p.classList.remove("hidden");
      var h=document.getElementById("hint");
      if(h)h.classList.remove("hidden");
    },{capture:true});
  });
})();

function stairProgress(x,z){if(x>stairX-2.8&&x<stairX+2.8&&z<=stairStartZ&&z>=stairStartZ-stairSteps*stairRun)return Math.max(0,Math.min(1,(stairStartZ-z)/(stairSteps*stairRun)));return -1}
function entryHeight(x,z){if(Math.abs(x)>6.2)return -1;for(let i=0;i<5;i++){const cz=15.05-i*.86;if(Math.abs(z-cz)<=.43&&Math.abs(x)<=((11.6-i*.32)/2))return(i+1)*.12+.035}if(Math.abs(x)<=6.5&&z>=5.3&&z<=11.9)return groundFloorTop;return -1}
let currentLevel=0;
function groundHeight(x,z){const p=stairProgress(x,z);if(p>=0){if(p>.92)currentLevel=1;if(p<.08)currentLevel=0;return .56+p*(level2Y-.56)}if(currentLevel===1)return level2Y;const e=entryHeight(x,z);if(e>=0)return e;if(z>9.2||x<-28||x>28)return .07;return groundFloorTop}
function upperWalk(x,z){if(x<-7.15||x>7.15)return x>-28.2&&x<28.2&&z>-33&&z<5;return(z>-4.3&&z<3.8)||(z>-34&&z<-26)}
function blockedAt(x,z){if(currentLevel===1&&stairProgress(x,z)<0&&!upperWalk(x,z))return true;return Math.abs(x)>29||z<-37||z>12}
function moveWithCollision(dx,dz){const nx=camera.position.x+dx,nz=camera.position.z+dz;const portal=(camera.position.z>7&&camera.position.z<24&&Math.abs(camera.position.x)<8.3)||(nz>7&&nz<24&&Math.abs(nx)<8.3);if(portal){camera.position.x=THREE.MathUtils.clamp(nx,-8.15,8.15);camera.position.z=nz;return}if(!blockedAt(nx,camera.position.z))camera.position.x=nx;if(!blockedAt(camera.position.x,nz))camera.position.z=nz}

function updateEntrance(dt){const dz=Math.abs(camera.position.z-10.8),dx=Math.abs(camera.position.x),open=dz<12.5&&dx<8.5;for(const d of entranceDoors){const target=d.userData.closedX+(open?d.userData.side*3.75:0);d.position.x+=THREE.MathUtils.clamp(target-d.position.x,-3.6*dt,3.6*dt)}}
const gameClock=new THREE.Clock(),keys=Object.create(null),mobile={x:0,y:0};let yaw=0,pitch=0,vy=0,grounded=true,started=false,lookId=null,lx=0,ly=0;
const canvas=renderer.domElement;
function nearestSpot(){const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).setY(0).normalize();let best=null,sc=99;for(const h of spots){const dx=h.x-camera.position.x,dz=h.z-camera.position.z,d=Math.hypot(dx,dz);if(d>4.2)continue;const dir=new THREE.Vector3(dx,0,dz).normalize();if(d>.7&&f.dot(dir)<0)continue;const score=d+(1-f.dot(dir));if(score<sc){sc=score;best=h}}return best}
function interact(){const h=nearestSpot();if(!h)return;const info=document.getElementById("info");info.innerHTML="<strong>"+(h.secret?"EASTER EGG":"MUSEUM")+"</strong><h3>"+h.t+"</h3><p>"+h.d+"</p>";info.style.display="block";if(h.secret&&!h.found){h.found=true;const toast=document.getElementById("toast");toast.textContent="發現隱藏彩蛋";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1500)}}
function jump(){if(started&&grounded){vy=6.4;grounded=false}}
function look(dx,dy){yaw-=dx*.0026;pitch=Math.max(-1.18,Math.min(1.18,pitch-dy*.0022))}
document.getElementById("startWorld").onclick=()=>{started=true;document.getElementById("startScreen").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");document.getElementById("hint").classList.remove("hidden");if(matchMedia("(pointer:fine)").matches)canvas.requestPointerLock?.()};
document.addEventListener("mousemove",e=>{if(document.pointerLockElement===canvas)look(e.movementX,e.movementY)});canvas.addEventListener("click",()=>{if(started&&matchMedia("(pointer:fine)").matches)canvas.requestPointerLock?.()});
canvas.addEventListener("pointerdown",e=>{if(!started||e.pointerType==="mouse")return;lookId=e.pointerId;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener("pointermove",e=>{if(e.pointerId!==lookId)return;look(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY});canvas.addEventListener("pointerup",()=>lookId=null);canvas.addEventListener("pointercancel",()=>lookId=null);

const zone=document.getElementById("joystick"),stick=document.getElementById("stick");if(zone){let active=false,pid=null;const radius=38;const mv=e=>{const r=zone.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1;if(l>radius){dx=dx/l*radius;dy=dy/l*radius}mobile.x=dx/radius;mobile.y=dy/radius;stick.style.transform="translate("+dx+"px,"+dy+"px)"};const stop=()=>{active=false;pid=null;mobile.x=0;mobile.y=0;stick.style.transform="translate(0,0)"};zone.addEventListener("pointerdown",e=>{active=true;pid=e.pointerId;zone.setPointerCapture?.(e.pointerId);mv(e)});zone.addEventListener("pointermove",e=>{if(active&&e.pointerId===pid)mv(e)});zone.addEventListener("pointerup",stop);zone.addEventListener("pointercancel",stop)}

function applyTimeMode(mode){timeMode=mode;const night=mode==="night";scene.background=night?nightSkyColor:dayFallbackColor;key.intensity=night?.24:2.25;fill.intensity=night?.08:.42;rim.intensity=night?.14:.30;stars.material.opacity=night?.95:0;nightLights.forEach(l=>l.intensity=night?(l.color.r>.8?24:7):0);document.getElementById("timeBtn").textContent=night?"切換至日景 · DAY":"切換至夜景 · NIGHT"}

function animate(){const dt=Math.min(gameClock.getDelta(),.045);updateEntrance(dt);if(!renderer.xr.isPresenting){const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let ix=0,iy=0;if(keys.KeyA)ix--;if(keys.KeyD)ix++;if(keys.KeyW)iy++;if(keys.KeyS)iy--;ix+=mobile.x;iy-=mobile.y;const l=Math.hypot(ix,iy)||1;if(l>1){ix/=l;iy/=l}const sp=(keys.ShiftLeft||keys.ShiftRight?6.2:3.2)*dt;moveWithCollision((r.x*ix-f.x*iy)*sp,(r.z*ix-f.z*iy)*sp);const floorY=groundHeight(camera.position.x,camera.position.z)+1.68;if(started){vy-=18*dt;camera.position.y+=vy*dt;if(camera.position.y<=floorY){camera.position.y=floorY;vy=0;grounded=true}else grounded=false}else camera.position.y+=(floorY-camera.position.y)*Math.min(1,dt*10);camera.rotation.set(pitch,yaw,0,"YXZ")}const h=nearestSpot(),prompt=document.getElementById("interaction");if(started&&h){prompt.textContent="E 互動｜"+h.t;prompt.classList.add("visible")}else prompt.classList.remove("visible");const t=performance.now()*.001;centralLight.intensity=46+8*Math.sin(t*1.4);rings.forEach((r,i)=>r.material.opacity=.55+.35*Math.sin(t*2+i));renderer.render(scene,camera)}
applyTimeMode("day");renderer.setAnimationLoop(animate);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
