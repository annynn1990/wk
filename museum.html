<script type="module">
import * as THREE from "three";
const scene=new THREE.Scene();
const daySky=new THREE.Color(0x9bc7eb),nightSky=new THREE.Color(0x162845);
scene.background=daySky.clone();
scene.fog=new THREE.Fog(daySky,48,175);

const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,260);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xeaf7ff,0x536273,2.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffefd4,3.15);sun.position.set(-45,58,28);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-95;sun.shadow.camera.right=95;sun.shadow.camera.top=95;sun.shadow.camera.bottom=-95;scene.add(sun);
const fill=new THREE.DirectionalLight(0xb5d8ff,.5);fill.position.set(40,24,-46);scene.add(fill);

const M={
 road:new THREE.MeshStandardMaterial({color:0x5e5a72,roughness:.9,flatShading:true}),
 roadEdge:new THREE.MeshStandardMaterial({color:0x787387,roughness:.9,flatShading:true}),
 paving:new THREE.MeshStandardMaterial({color:0xe6dce7,roughness:.95,flatShading:true}),
 grass:new THREE.MeshStandardMaterial({color:0x68a368,roughness:1,flatShading:true}),
 pink:new THREE.MeshStandardMaterial({color:0xefaab7,roughness:.82,flatShading:true}),
 blue:new THREE.MeshStandardMaterial({color:0x7daed7,roughness:.82,flatShading:true}),
 cream:new THREE.MeshStandardMaterial({color:0xf2dba5,roughness:.84,flatShading:true}),
 mint:new THREE.MeshStandardMaterial({color:0x93cabc,roughness:.84,flatShading:true}),
 lilac:new THREE.MeshStandardMaterial({color:0xb9a7d2,roughness:.84,flatShading:true}),
 white:new THREE.MeshStandardMaterial({color:0xf7f7f5,roughness:.74,flatShading:true}),
 roof:new THREE.MeshStandardMaterial({color:0x4d4656,roughness:.92,flatShading:true}),
 window:new THREE.MeshStandardMaterial({color:0x9bcde0,roughness:.22,metalness:.05,flatShading:true}),
 dark:new THREE.MeshStandardMaterial({color:0x36495a,roughness:.75,flatShading:true}),
 gold:new THREE.MeshStandardMaterial({color:0xe4b962,roughness:.4,metalness:.3,flatShading:true}),
 green:new THREE.MeshStandardMaterial({color:0x4f9861,roughness:1,flatShading:true}),
 trunk:new THREE.MeshStandardMaterial({color:0x785845,roughness:1,flatShading:true}),
 skin:new THREE.MeshStandardMaterial({color:0xf0c3a7,roughness:.8,flatShading:true}),
 shirt:new THREE.MeshStandardMaterial({color:0xf4f4f1,roughness:.76,flatShading:true}),
 pants:new THREE.MeshStandardMaterial({color:0x355a89,roughness:.82,flatShading:true}),
 shoe:new THREE.MeshStandardMaterial({color:0xf5f2eb,roughness:.86,flatShading:true})
};

function addBox(w,h,d,x,y,z,mat,ry=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function addCylinder(r,h,x,y,z,mat,seg=14){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}
function ground(w,d,x,z,mat){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(x,0,z);m.receiveShadow=true;scene.add(m);return m}
function canvasSign(title,sub,bg="#ffffff",fg="#22384d",accent="#4b83be"){
 const c=document.createElement("canvas");c.width=900;c.height=250;const g=c.getContext("2d");
 g.fillStyle=bg;g.fillRect(0,0,900,250);g.fillStyle=accent;g.fillRect(0,0,900,18);
 g.fillStyle=fg;g.font='700 44px "Microsoft JhengHei","Noto Serif TC",sans-serif';g.textAlign="center";g.fillText(title,450,104);
 g.fillStyle="#62788a";g.font="19px Arial";g.fillText(sub,450,150);return new THREE.CanvasTexture(c);
}
function sign(title,sub,x,y,z,rot=0,bg="#ffffff",accent="#4b83be"){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3.8,1.05),new THREE.MeshBasicMaterial({map:canvasSign(title,sub,bg,"#243a4e",accent),transparent:true}));
 m.position.set(x,y,z);m.rotation.y=rot;scene.add(m);return m;
}

// ---------- Reference-like street composition ----------
ground(180,180,0,-18,M.grass);
ground(18,145,0,-18,M.road);
ground(140,20,0,2,M.road);
addBox(3,.12,145,-10.5,.06,-18,M.paving);addBox(3,.12,145,10.5,.06,-18,M.paving);
addBox(140,.12,3,0,.06,-31,M.paving);addBox(140,.12,3,0,.06,15,M.paving);

for(let z=-88;z<47;z+=8){addBox(.16,.02,3,-4.2,.11,z,M.white);addBox(.16,.02,3,4.2,.11,z,M.white)}
for(let x=-65;x<66;x+=8)addBox(3,.02,.15,x,.11,2,M.white);

function windowRow(x,y,z,count,front=true){
 for(let i=0;i<count;i++){
  const xx=x+(i-(count-1)/2)*1.55;
  addBox(.86,1.08,.06,xx,y,z,M.window);
  addBox(.06,1.08,.02,xx,y,z-.045,M.dark);
 }
}
function storefront(x,z,w,d,h,body,title,sub,roofStyle="flat"){
 addBox(w,h,d,x,h/2,z,body);
 // front facade windows
 const frontZ=z-d/2-.035;
 for(let yy=1.8;yy<h-.9;yy+=1.8){
   for(let xx=x-w/2+1.15;xx<x+w/2-.2;xx+=1.7)addBox(.88,1.02,.06,xx,yy,frontZ,M.window);
 }
 // side windows
 const sideX=x-w/2-.035;
 for(let yy=1.8;yy<h-.9;yy+=1.8)for(let zz=z-d/2+1.1;zz<z+d/2-.4;zz+=1.7)addBox(.06,1.0,.86,sideX,yy,zz,M.window);
 // roof silhouette
 if(roofStyle==="gable"){
   const roofMat=new THREE.Mesh(new THREE.CylinderGeometry(1,1, w*.92,4,1),M.roof); // diamond-like low poly roof
   roofMat.scale.set(1,d*.72,.55);roofMat.rotation.x=Math.PI/2;roofMat.rotation.z=Math.PI/4;roofMat.position.set(x,h+.65,z);roofMat.castShadow=true;scene.add(roofMat);
 }else{
   addBox(w+.35,.28,d+.35,x,h+.16,z,M.roof);
 }
 sign(title,sub,x,h+.95,frontZ-.04,Math.PI,"#ffffff",body===M.blue?"#4a9de0":body===M.pink?"#ec8ea1":body===M.cream?"#e1af48":"#6a8fba");
}

storefront(-23,2,15,12,11,M.blue,"BRAND","WONGMING STREET","flat");
storefront(-41,-1,14,13,10,M.pink,"皇家音樂廳","ROYAL CONCERT HALL","gable");
storefront(-59,-4,14,12,13,M.lilac,"司憲院","IMPERIAL COURT","flat");
storefront(23,3,15,12,11,M.cream,"歷史檔案館","ARCHIVE HOUSE","gable");
storefront(41,-1,15,13,12,M.mint,"文化交流館","CULTURE HOUSE","flat");
storefront(59,-4,15,12,14,M.blue,"帝國圖書館","IMPERIAL LIBRARY","gable");

// Distinctive foreground left circular sign.
addBox(5.8,4.3,.45,-23,4.5,-4.1,M.white);
const brandDisk=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.18,32),M.gold);brandDisk.rotation.x=Math.PI/2;brandDisk.position.set(-23,5.6,-4.18);brandDisk.castShadow=true;scene.add(brandDisk);
sign("BRAND","WONGMING",-23,5.6,-4.3,Math.PI/2,"#6a8ed3","#ffffff","#d7ecff");

// Right tiled-roof shop to echo the reference silhouette.
addBox(17,7,13,24,3.5,-7,M.white);
for(let i=0;i<9;i++)addBox(.82,.92,.05,17.1+i*1.7,3.0,-13.56,M.window);
addBox(18.4,.3,14.4,24,7.08,-7,M.roof,.0);
sign("文化商店","WONGMING MARKET",24,4.9,-13.62,Math.PI,"#fff","#2a4258","#d7a84b");

// Tall billboard in the center background.
addBox(7.2,21,3.2,6,10.5,-21,M.white);
for(let y=3;y<19;y+=3.4)addBox(5.2,2.05,.08,6,y,-22.62,M.pink);
sign("黃名帝國","WONGMING EMPIRE",6,18.7,-22.68,Math.PI,"#eaf2f9","#24435e","#5488c1");

// Central overhead street sign.
addBox(11,.18,.45,0,6.1,-7,M.dark);
addBox(.18,4.6,.18,-5.35,3.8,-7,M.dark);
addBox(.18,4.6,.18,5.35,3.8,-7,M.dark);
sign("黃名歷史街區","HISTORY DISTRICT",-2.0,6.18,-7.28,Math.PI,"#202a3a","#ffffff","#202a3a");
sign("WONGMING STREET","EXPLORE",2.25,6.18,-7.28,Math.PI,"#202a3a","#ffffff","#202a3a");

// Museum destination: large pastel landmark behind the street.
addBox(28,10,17,0,5.05,-61,M.white);
addBox(24,4.5,4,-0,11.8,-57.8,M.blue);
for(let x=-10;x<=10;x+=4)addBox(2.25,4,.28,x,3,-52.45,M.window);
sign("黃名歷史博物館","WONGMING MUSEUM",0,9.4,-52.45,Math.PI,"#ffffff","#24435e","#4c87c3");
for(let x=-13;x<=13;x+=4.3)addCylinder(.13,3.1,x,1.55,-50.5,M.gold,10);

// Lamps, trees, benches.
function lamp(x,z){
 addCylinder(.14,3.8,x,1.9,z,M.dark,12);addBox(.65,.12,.35,x,3.85,z,M.gold);
}
for(const z of [11,2,-7,-16,-25,-34]){lamp(-8.3,z);lamp(8.3,z)}
function tree(x,z,s=1){
 addCylinder(.28,2.2,x,1.1,z,M.trunk,10);
 const crown=new THREE.Mesh(new THREE.DodecahedronGeometry(1.65*s,0),M.green);crown.position.set(x,2.9*s,z);crown.castShadow=true;scene.add(crown);
 const crown2=crown.clone();crown2.position.x=x+.8*s;crown2.position.y=3.2*s;crown2.scale.setScalar(.78);scene.add(crown2);
}
for(const q of [[-12,9,1],[12,9,1],[-13,-2,.9],[13,-2,.9],[-14,-27,1], [14,-27,1]])tree(q[0],q[1],q[2]);
function bench(x,z,rot=0){
 const g=new THREE.Group();g.position.set(x,.78,z);g.rotation.y=rot;scene.add(g);
 addBox(2.0,.16,.46,0,.36,0,M.trunk); // position is wrong if direct scene
 const seat=g.children[g.children.length-1]; // placeholder not used
}
for(const x of [-8,8]){addBox(2,.16,.45,x,.76,10,M.trunk);addBox(.12,.6,.12,x-.7,.45,10,M.gold);addBox(.12,.6,.12,x+.7,.45,10,M.gold)}

// Cartoon car in right foreground.
const car=new THREE.Group();scene.add(car);car.position.set(8,.55,17);
const cb=new THREE.Mesh(new THREE.BoxGeometry(4.1,.8,1.7),new THREE.MeshStandardMaterial({color:0x4e89c8,roughness:.32,metalness:.15,flatShading:true}));cb.castShadow=true;car.add(cb);
const roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,.62,1.35),M.window);roof.position.y=.65;roof.castShadow=true;car.add(roof);
for(const sx of [-1.5,1.5])for(const sy of [-.78,.78]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.24,16),M.dark);w.rotation.z=Math.PI/2;w.position.set(sx,-.47,sy);w.castShadow=true;car.add(w)}

// ---------- Characters ----------
function makeCharacter(shirtMat,pantsMat,scale=1){
  const g=new THREE.Group();
  function cp(geo,mat,x,y,z){
    const o=new THREE.Mesh(geo,mat);
    o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
  }
  const head=cp(new THREE.SphereGeometry(.34,18,14),M.skin,0,1.98,0);
  cp(new THREE.BoxGeometry(.72,.08,.34),M.dark,0,2.22,0);
  const body=cp(new THREE.CapsuleGeometry(.40,.78,6,10),shirtMat,0,1.22,0);
  const lArm=cp(new THREE.CapsuleGeometry(.11,.60,5,8),shirtMat,-.48,1.20,0);
  const rArm=cp(new THREE.CapsuleGeometry(.11,.60,5,8),shirtMat,.48,1.20,0);
  const lLeg=cp(new THREE.CapsuleGeometry(.13,.64,5,8),pantsMat,-.19,.55,0);
  const rLeg=cp(new THREE.CapsuleGeometry(.13,.64,5,8),pantsMat,.19,.55,0);
  cp(new THREE.BoxGeometry(.27,.12,.45),M.shoe,-.19,.17,-.08);
  cp(new THREE.BoxGeometry(.27,.12,.45),M.shoe,.19,.17,-.08);
  g.scale.setScalar(scale);
  g.userData.lArm=lArm;g.userData.rArm=rArm;g.userData.lLeg=lLeg;g.userData.rLeg=rLeg;
  return g;
}

const avatar=makeCharacter(M.shirt,M.pants,1);
scene.add(avatar);
avatar.position.set(0,.02,21);

const npcs=[
  {obj:makeCharacter(new THREE.MeshStandardMaterial({color:0xf0b3a6,roughness:.82,flatShading:true}),new THREE.MeshStandardMaterial({color:0x5b467f,roughness:.84,flatShading:true}),.92),x:-6,z:8,turn:.25,phase:0},
  {obj:makeCharacter(new THREE.MeshStandardMaterial({color:0xd9f0d9,roughness:.82,flatShading:true}),new THREE.MeshStandardMaterial({color:0x4f6d54,roughness:.84,flatShading:true}),.96),x:7,z:0,turn:-.35,phase:1.7},
  {obj:makeCharacter(new THREE.MeshStandardMaterial({color:0xf0dfb0,roughness:.82,flatShading:true}),new THREE.MeshStandardMaterial({color:0x496788,roughness:.84,flatShading:true}),.90),x:-7,z:-18,turn:.15,phase:3.1},
  {obj:makeCharacter(new THREE.MeshStandardMaterial({color:0xd6e2f4,roughness:.82,flatShading:true}),new THREE.MeshStandardMaterial({color:0x6d4e4a,roughness:.84,flatShading:true}),.98),x:8,z:-29,turn:-.1,phase:4.6}
];
// ---------- Colliders ----------
const colliders=[
 [-31,-15,-4,14],[-49,-33,-8,6],[-67,-51,-10,2],
 [15,31,-3,14],[33,49,-8,6],[51,67,-10,2],
 [-15,15,-70,-53]
];
function blocked(x,z){
 if(x<-78||x>78||z<-84||z>45)return true;
 for(const c of colliders)if(x>c[0]&&x<c[1]&&z>c[2]&&z<c[3])return true;
 return false;
}

// ---------- Landmarks ----------
const landmarks=[
 {name:"BRAND 街區",x:-23,z:-4,desc:"黃名帝國街區入口，對應商業街核心地標。"},
 {name:"皇家音樂廳",x:-41,z:-1,desc:"黃名帝國典禮與音樂演出文化場館。"},
 {name:"司憲院",x:-59,z:-4,desc:"司法與憲制歷史展示地標。"},
 {name:"歷史檔案館",x:23,z:-1,desc:"帝國歷史文書與檔案收藏。"},
 {name:"文化交流館",x:41,z:-1,desc:"文化與交流主題館。"},
 {name:"帝國圖書館",x:59,z:-4,desc:"出版、知識與文化收藏。"},
 {name:"黃名歷史博物館",x:0,z:-50,desc:"街區最深處的主要歷史博物館。"}
];
for(const lm of landmarks){
 const m=new THREE.Mesh(new THREE.TorusGeometry(.58,.075,10,28),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9}));
 m.rotation.x=-Math.PI/2;m.position.set(lm.x,.13,lm.z);scene.add(m);lm.marker=m;
}

function paintMap(){
 const c=document.getElementById("mapCanvas"),g=c.getContext("2d");g.clearRect(0,0,155,112);
 g.fillStyle="#eef4f8";g.fillRect(0,0,155,112);
 g.fillStyle="#c3d1dc";g.fillRect(54,0,47,112);g.fillRect(0,40,155,32);
 g.fillStyle="#b6d3bd";g.fillRect(5,5,42,30);g.fillRect(107,77,43,30);
 g.fillStyle="#e1b2bd";g.fillRect(5,77,42,30);g.fillStyle="#d9c2df";g.fillRect(108,5,42,30);
 g.fillStyle="#8ca5b7";
 for(const lm of landmarks){const px=77+lm.x*.42,py=56-lm.z*.42;g.beginPath();g.arc(px,py,2.4,0,Math.PI*2);g.fill()}
}
paintMap();
function updateMap(){
 const dot=document.getElementById("mapDot");dot.style.left=(77+avatar.position.x*.42)+"px";dot.style.top=(56-avatar.position.z*.42)+"px";
}

let isNight=false;
function setNight(v){
 isNight=v;scene.background=(v?nightSky:daySky).clone();scene.fog.color=scene.background.clone();sun.intensity=v?.72:3.15;hemi.intensity=v?.7:2.15;fill.intensity=v?.18:.5;
 document.getElementById("dayBtn").classList.toggle("active",v);
}
setNight(false);

function openExhibits(title="黃名歷史展區",text="從這條街道進入黃名帝國的歷史地標。"){
 document.getElementById("modalTitle").textContent=title;document.getElementById("modalText").textContent=text;
 const grid=document.getElementById("grid");grid.innerHTML="";
 for(const lm of landmarks){
   const tile=document.createElement("div");tile.className="tile";tile.innerHTML="<b>"+lm.name+"</b><span>"+lm.desc+"</span>";
   tile.onclick=()=>{avatar.position.set(lm.x,0.02,lm.z+6);document.getElementById("modal").classList.remove("modalOn")};
   grid.appendChild(tile);
 }
 document.getElementById("modal").classList.add("modalOn");
}
document.getElementById("viewBtn").onclick=()=>openExhibits();
document.getElementById("infoBtn").onclick=()=>openExhibits();
document.getElementById("museumBtn").onclick=()=>openExhibits("黃名歷史博物館","從街區一路走到盡頭即可抵達主館。");
document.getElementById("dayBtn").onclick=()=>setNight(!isNight);
document.getElementById("resetBtn").onclick=()=>{avatar.position.set(0,.02,21);camYaw=0;camPitch=.30};
document.getElementById("streetBtn").onclick=()=>document.getElementById("modal").classList.remove("modalOn");
document.getElementById("walkBtn").onclick=()=>document.getElementById("modal").classList.remove("modalOn");
document.getElementById("closeModal").onclick=()=>document.getElementById("modal").classList.remove("modalOn");

window.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space","KeyE","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
 if(e.code==="KeyE"&&nearest)openExhibits(nearest.name,nearest.desc);
});
window.addEventListener("keyup",e=>keys[e.code]=false);

// Standard third-person camera-relative controls.
renderer.domElement.addEventListener("mousedown",e=>{dragging=true;lx=e.clientX;ly=e.clientY});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{
 if(!dragging)return;
 camYaw-=(e.clientX-lx)*.006;camPitch=Math.max(.10,Math.min(.78,camPitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;
});
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse")return;
 touchLook=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==touchLook)return;
 camYaw-=(e.clientX-lx)*.006;camPitch=Math.max(.10,Math.min(.78,camPitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;
});
renderer.domElement.addEventListener("pointerup",()=>touchLook=null);
renderer.domElement.addEventListener("pointercancel",()=>touchLook=null);

const joyEl=document.getElementById("joy"),stickEl=document.getElementById("stick");let joyOn=false,joyId=null,joyX=0,joyY=0;
function moveJoy(e){
 const r=joyEl.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),len=Math.hypot(dx0,dy0)||1,rad=38;
 let dx=dx0,dy=dy0;if(len>rad){dx=dx0/len*rad;dy=dy0/len*rad}
 joyX=dx/rad;joyY=dy/rad;stickEl.style.transform="translate("+dx+"px,"+dy+"px)";
}
function stopJoy(){joyOn=false;joyId=null;joyX=0;joyY=0;stickEl.style.transform="translate(0,0)"}
joyEl.addEventListener("pointerdown",e=>{joyOn=true;joyId=e.pointerId;joyEl.setPointerCapture?.(e.pointerId);moveJoy(e)});
joyEl.addEventListener("pointermove",e=>{if(joyOn&&e.pointerId===joyId)moveJoy(e)});
joyEl.addEventListener("pointerup",stopJoy);joyEl.addEventListener("pointercancel",stopJoy);
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();keys.Space=true;setTimeout(()=>keys.Space=false,120)});

let nearest=null;
function loop(){
 const dt=Math.min(clock.getDelta(),.04);
 let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joyY;
 let strafe=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joyX;
 const len=Math.hypot(forward,strafe)||1;if(len>1){forward/=len;strafe/=len}
 const speed=(keys.ShiftLeft||keys.ShiftRight?7.0:3.5)*dt;
 // Camera-relative basis: forward follows yaw; right is yaw + 90 degrees.
 const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw);
 const rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
 const dx=(fx*forward+rx*strafe)*speed;
 const dz=(fz*forward+rz*strafe)*speed;
 const nx=avatar.position.x+dx,nz=avatar.position.z+dz;
 if((dx||dz)&&!blocked(nx,avatar.position.z))avatar.position.x=nx;
 if((dx||dz)&&!blocked(avatar.position.x,nz))avatar.position.z=nz;
 if(dx||dz){
  avatar.rotation.y=Math.atan2(dx,dz);
  const walk=Math.sin(performance.now()*.011)*.2;
  armL.rotation.z=.14+walk;armR.rotation.z=-.14-walk;
  legL.rotation.x=walk*.75;legR.rotation.x=-walk*.75;
 }else{armL.rotation.z=.14;armR.rotation.z=-.14;legL.rotation.x=0;legR.rotation.x=0}
 if(keys.Space&&avatar.position.y<=.03)avatar.userData.vy=6.2;
 avatar.userData.vy=(avatar.userData.vy||0)-17.5*dt;avatar.position.y+=avatar.userData.vy*dt;if(avatar.position.y<.02){avatar.position.y=.02;avatar.userData.vy=0}
 const target=new THREE.Vector3(avatar.position.x,avatar.position.y+1.16,avatar.position.z);
 const flat=camDistance*Math.cos(camPitch),up=camDistance*Math.sin(camPitch);
 const desired=new THREE.Vector3(target.x+Math.sin(camYaw)*flat,target.y+up,target.z+Math.cos(camYaw)*flat);
 camera.position.lerp(desired,Math.min(1,dt*8));camera.lookAt(target);
 nearest=null;let nearestDist=999;
 for(const lm of landmarks){
  const d=Math.hypot(lm.x-avatar.position.x,lm.z-avatar.position.z);
  lm.marker.scale.setScalar(.82+.14*Math.sin(performance.now()*.003));
  if(d<4.6&&d<nearestDist){nearest=lm;nearestDist=d}
 }
 const pr=document.getElementById("prompt");
 if(nearest){pr.textContent="E  查看 · "+nearest.name;pr.classList.add("promptOn")}else pr.classList.remove("promptOn");
 updateMap();

 const tNow=performance.now()*.001;
 for(let ni=0;ni<npcs.length;ni++){
   const n=npcs[ni];
   const w=Math.sin(tNow*1.8+n.phase)*.055;
   n.obj.position.y=.02+Math.abs(Math.sin(tNow*1.15+n.phase))*.018;
   n.obj.userData.lArm.rotation.z=.14+w;
   n.obj.userData.rArm.rotation.z=-.14-w;
 }
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});


</script>
</body>
