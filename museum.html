<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黃名帝國 · 3D 歷史街區</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cc7ec;font-family:Arial,"Microsoft JhengHei",sans-serif}
body{user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit}
#topbar{position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);display:flex;background:#fff;border-radius:18px;padding:3px;box-shadow:0 9px 26px #1e3b5d30}
.mode{min-width:92px;height:34px;border:0;border-radius:15px;background:transparent;color:#3c5267;font-size:11px;cursor:pointer}
.mode.active{background:#245db3;color:#fff}
#brand{position:fixed;z-index:20;left:22px;top:20px;color:#17324d;text-shadow:0 2px 10px #fff8;pointer-events:none}
#brand strong{display:block;font:700 20px/1.1 "Noto Serif TC","Microsoft JhengHei",serif;letter-spacing:.1em}
#brand span{font-size:8px;letter-spacing:.18em}
#map{position:fixed;z-index:20;left:18px;bottom:20px;width:154px;height:112px;border-radius:15px;background:#ffffffdc;border:1px solid #fff;box-shadow:0 12px 30px #17324d2c;overflow:hidden}
#mapCanvas{width:100%;height:100%;display:block}
#mapLabel{position:absolute;left:9px;top:7px;color:#52708a;font-size:8px;letter-spacing:.14em}
#mapDot{position:absolute;width:9px;height:9px;border-radius:50%;background:#245db3;box-shadow:0 0 0 4px #245db327;transform:translate(-50%,-50%)}
#sideBubble{position:fixed;z-index:22;right:20px;bottom:115px;width:190px;padding:13px 15px;border-radius:16px;background:#fff;box-shadow:0 14px 34px #17324d33;color:#3c5267;font-size:11px;line-height:1.65}
#sideBubble:after{content:"";position:absolute;left:28px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#sideBubble b{color:#245db3}
#actions{position:fixed;z-index:21;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 9px;border-radius:22px;background:#ffffffb8;box-shadow:0 12px 30px #17324d28;backdrop-filter:blur(10px)}
.action{width:39px;height:39px;border-radius:50%;border:1px solid #fff;background:#eef4fa;color:#5b7489;cursor:pointer}
.action.active{background:#245db3;color:#fff}
#prompt{position:fixed;z-index:30;left:50%;bottom:76px;transform:translate(-50%,10px);padding:8px 14px;border-radius:16px;background:#fff;color:#31506b;font-size:11px;box-shadow:0 10px 25px #17324d2b;opacity:0;transition:.18s;pointer-events:none}
#prompt.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#17324d55;backdrop-filter:blur(9px)}
#panel.on{display:flex}
.panelCard{width:min(760px,88vw);max-height:78vh;overflow:auto;padding:26px;border-radius:22px;background:#fff;box-shadow:0 30px 90px #17324d4a;color:#294862}
.panelTop{display:flex;justify-content:space-between;align-items:start;gap:14px}
.panelKicker{font-size:8px;letter-spacing:.18em;color:#5b89b5}
.panelCard h2{margin:5px 0 6px;font:700 29px "Noto Serif TC","Microsoft JhengHei",serif}
.panelCard p{margin:0;color:#678095;line-height:1.8;font-size:12px}
.close{width:34px;height:34px;border-radius:50%;border:0;background:#eef4fa;color:#557086;cursor:pointer}
.exhibits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.exhibit{padding:14px;border-radius:16px;background:#f3f7fa;border:1px solid #e7eef4;cursor:pointer}
.exhibit:hover{background:#eaf2f8}
.exhibit b{display:block;font-size:12px;color:#315b80;margin-bottom:5px}
.exhibit span{font-size:10px;color:#7690a4;line-height:1.5}
#mobile{position:fixed;z-index:25;left:0;right:0;bottom:0;height:170px;display:none;pointer-events:none}
#joy{position:absolute;left:18px;bottom:22px;width:112px;height:112px;border-radius:50%;background:#ffffff36;border:1px solid #ffffff65;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;margin:-25px;width:50px;height:50px;border-radius:50%;background:#ffffffaa;border:1px solid #fff;box-shadow:0 6px 18px #17324d2b}
#mobileJump{position:absolute;right:22px;bottom:30px;width:66px;height:66px;border:0;border-radius:50%;background:#ffffffdb;color:#245db3;box-shadow:0 10px 25px #17324d30;pointer-events:auto;touch-action:none;font-size:24px}
@media(max-width:760px){
 #brand{left:12px;top:12px}
 #brand strong{font-size:17px}
 #brand span{display:none}
 #topbar{top:10px}
 #map{left:10px;bottom:12px;width:132px;height:94px}
 #actions{bottom:11px}
 #sideBubble{right:10px;bottom:104px;width:160px;font-size:10px}
 #prompt{bottom:160px}
 #mobile{display:block}
 .exhibits{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="topbar">
 <button class="mode active" id="streetMode">Street</button>
 <button class="mode" id="exhibitMode">View Exhibits</button>
</div>
<div id="brand"><strong>黃名帝國</strong><span>WONGMING EMPIRE · HISTORY DISTRICT</span></div>
<div id="map"><div id="mapLabel">STREET MAP</div><canvas id="mapCanvas" width="154" height="112"></canvas><div id="mapDot"></div></div>
<div id="sideBubble"><b>歡迎來到黃名帝國</b><br>沿著街區自由探索。靠近地標時按 <b>E</b> 查看展覽。</div>
<div id="actions">
 <button class="action active" id="actWalk" title="自由探索">◫</button>
 <button class="action" id="actMuseum" title="博物館">⌂</button>
 <button class="action" id="actNight" title="夜景">☾</button>
 <button class="action" id="actInfo" title="展覽">i</button>
 <button class="action" id="actReset" title="回到中央街道">◎</button>
</div>
<div id="prompt"></div>
<div id="panel">
 <div class="panelCard">
  <div class="panelTop">
   <div><div class="panelKicker">WONGMING HISTORY DISTRICT</div><h2 id="panelTitle">黃名歷史展區</h2><p id="panelText">沿著街道探索博物館與各個歷史地標。</p></div>
   <button class="close" id="panelClose">×</button>
  </div>
  <div class="exhibits" id="exhibits"></div>
 </div>
</div>
<div id="mobile"><div id="joy"><div id="stick"></div></div><button id="mobileJump">↑</button></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc4e8);
scene.fog=new THREE.Fog(0x9bc4e8,55,175);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,260);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xeaf6ff,0x51606e,2.1);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,3.0);
sun.position.set(-35,55,24);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-85;sun.shadow.camera.right=85;
sun.shadow.camera.top=85;sun.shadow.camera.bottom=-85;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xa9d7ff,.55);
fill.position.set(36,20,-42);
scene.add(fill);

const clock=new THREE.Clock();
let night=false;
let gameStarted=true;
const keys={};
const joystick={x:0,y:0};
let yaw=0,pitch=.28;
let dragging=false,lx=0,ly=0,touchLook=null;
let nearest=null;

const mats={
 road:new THREE.MeshStandardMaterial({color:0x655f73,roughness:.88}),
 sidewalk:new THREE.MeshStandardMaterial({color:0xe1d6e0,roughness:.92}),
 curb:new THREE.MeshStandardMaterial({color:0xb4aebb,roughness:.9}),
 grass:new THREE.MeshStandardMaterial({color:0x67a567,roughness:1}),
 white:new THREE.MeshStandardMaterial({color:0xf6f8fa,roughness:.65}),
 window:new THREE.MeshStandardMaterial({color:0x9ed7ea,roughness:.2,metalness:.1}),
 pink:new THREE.MeshStandardMaterial({color:0xf1abb7,roughness:.8}),
 blue:new THREE.MeshStandardMaterial({color:0x83b6e0,roughness:.8}),
 cream:new THREE.MeshStandardMaterial({color:0xf5dba7,roughness:.8}),
 lilac:new THREE.MeshStandardMaterial({color:0xbfaedb,roughness:.8}),
 mint:new THREE.MeshStandardMaterial({color:0x93cdbf,roughness:.8}),
 dark:new THREE.MeshStandardMaterial({color:0x344454,roughness:.72}),
 gold:new THREE.MeshStandardMaterial({color:0xe2b65d,metalness:.35,roughness:.35}),
 leaf:new THREE.MeshStandardMaterial({color:0x4e9a64,roughness:1}),
 trunk:new THREE.MeshStandardMaterial({color:0x765541,roughness:1}),
 lamp:new THREE.MeshStandardMaterial({color:0x2e3941,metalness:.45,roughness:.35}),
 avatarShirt:new THREE.MeshStandardMaterial({color:0xf4f4f4,roughness:.72}),
 avatarPants:new THREE.MeshStandardMaterial({color:0x365886,roughness:.82}),
 skin:new THREE.MeshStandardMaterial({color:0xf0c1a4,roughness:.8}),
 shoe:new THREE.MeshStandardMaterial({color:0xf5f3ee,roughness:.85})
};

function box(w,h,d,x,y,z,mat,rot=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);m.rotation.y=rot;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(rad,h,x,y,z,mat,seg=18){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,seg),mat);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function plane(w,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
 m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;
}
function textTexture(title,sub,bg="#ffffff"){
 const c=document.createElement("canvas");c.width=900;c.height=250;
 const g=c.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,900,250);
 g.fillStyle="#1f3347";g.font='700 46px "Microsoft JhengHei","Noto Serif TC",sans-serif';g.textAlign="center";g.fillText(title,450,100);
 g.fillStyle="#567189";g.font="20px Arial";g.fillText(sub,450,150);
 return new THREE.CanvasTexture(c);
}
function sign(title,sub,x,y,z,rot=0,bg="#ffffff"){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.98),new THREE.MeshBasicMaterial({map:textTexture(title,sub,bg),transparent:true}));
 m.position.set(x,y,z);m.rotation.y=rot;scene.add(m);return m;
}

// Ground and street — broad, readable lanes like the reference.
plane(170,170,0,0,-18,mats.grass);
box(25,.08,150,0,.05,-18,mats.road);
box(150,.08,22,0,.06,8,mats.road);
box(150,.10,3,-0,.09,-13,mats.sidewalk);
box(150,.10,3,-0,.09,29,mats.sidewalk);
box(3,.11,150,-14,.10,-18,mats.sidewalk);
box(3,.11,150,14,.10,-18,mats.sidewalk);

for(let z=-78;z<46;z+=7){
 box(.13,.02,3,-3.5,.11,z,mats.white);
 box(.13,.02,3,3.5,.11,z,mats.white);
}
for(let x=-70;x<71;x+=7)box(3,.02,.13,x,.11,-3,mats.white);

function windows(x,y,z,count,side,color){
 for(let i=0;i<count;i++){
  const ox=(i-(count-1)/2)*1.55;
  box(.82,1.05,.06,x+ox,y,z+(side?-.03:.03),mats.window);
 }
}
function building(x,z,w,d,h,mat,title){
 box(w,h,d,x,h/2,z,mat);
 const side=Math.sign(x||1);
 for(let yy=2.1;yy<h-.8;yy+=2.05){
  for(let xx=x-w/2+1.1;xx<x+w/2-0.5;xx+=1.7)box(.82,1.0,.05,xx,yy,z+d/2+.03,mats.window);
 }
 sign(title,"WONGMING STREET",x,z? h*.72:2,z-d/2-.04,Math.PI,mat===mats.blue?"#dff1ff":"#fff");
}

// City blocks on both sides.
building(-24,-8,15,13,12,mats.blue,"帝國郵政");
building(-42,8,17,14,10,mats.pink,"皇家音樂廳");
building(-62,-9,15,13,14,mats.lilac,"司憲院");
building(24,-8,15,13,11,mats.cream,"歷史檔案館");
building(42,8,16,14,13,mats.mint,"文化交流館");
building(62,-9,15,13,15,mats.blue,"帝國圖書館");

// Background high-rise silhouettes.
for(let i=0;i<14;i++){
 const side=i%2?-1:1,z=-45-i*7,x=side*(32+(i%5)*8),h=16+(i%4)*6,w=8+(i%3)*3;
 box(w,h,w,x,h/2,z,[mats.blue,mats.pink,mats.cream,mats.lilac][i%4]);
}

// Museum at street end.
box(26,12,16,0,6.0,-67,mats.white);
box(20,7,3,0,9.5,-58,mats.gold);
for(let x=-10;x<=10;x+=4)box(2.5,4,0.35,x,3.0,-58,mats.window);
sign("黃名歷史博物館","WONGMING MUSEUM",0,9.2,-57.7,0,"#fdfdfd");
box(13,.6,7,0,.38,-54,mats.sidewalk);

// Sidewalk storefront details.
function awning(x,z,mat,rot=0){box(3.7,.18,1.0,x,3.0,z,mat,rot)}
awning(-24,-15,mats.pink);awning(-42,1,mats.cream);awning(24,-15,mats.blue);awning(42,1,mats.pink);
for(let z=-4;z<30;z+=8){
 cyl(.18,3.7,-11,1.85,z,mats.lamp,12);cyl(.16,3.7,11,1.85,z,mats.lamp,12);
 box(.65,.1,.3,-11,3.65,z,mats.gold);box(.65,.1,.3,11,3.65,z,mats.gold);
}
for(let x of [-52,-34,-16,16,34,52]){cyl(.28,2.4,x,1.2,-2,mats.trunk,10);cyl(1.25,1.9,x,3.1,-2,mats.leaf,12);}

// Benches.
for(const q of [[-9,4],[9,4],[-9,-30],[9,-30]]){
 box(2.2,.15,.48,q[0],.78,q[1],mats.trunk);
 box(.12,.55,.12,q[0]-.72,.48,q[1],mats.gold);box(.12,.55,.12,q[0]+.72,.48,q[1],mats.gold);
}

// Avatar.
const avatar=new THREE.Group();scene.add(avatar);
function ap(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;avatar.add(o);return o}
ap(new THREE.CapsuleGeometry(.42,.85,6,12),mats.avatarShirt,0,1.25,0);
ap(new THREE.SphereGeometry(.36,20,16),mats.skin,0,2.02,0);
ap(new THREE.BoxGeometry(.78,.08,.36),mats.dark,0,2.24,0);
const armL=ap(new THREE.CapsuleGeometry(.11,.62,5,8),mats.avatarShirt,-.5,1.25,0);
const armR=ap(new THREE.CapsuleGeometry(.11,.62,5,8),mats.avatarShirt,.5,1.25,0);
const legL=ap(new THREE.CapsuleGeometry(.13,.62,5,8),mats.avatarPants,-.2,.54,0);
const legR=ap(new THREE.CapsuleGeometry(.13,.62,5,8),mats.avatarPants,.2,.54,0);
ap(new THREE.BoxGeometry(.28,.13,.48),mats.shoe,-.2,.18,-.05);
ap(new THREE.BoxGeometry(.28,.13,.48),mats.shoe,.2,.18,-.05);
avatar.position.set(0,.02,26);

// Decorative car.
const car=new THREE.Group();scene.add(car);car.position.set(7,.5,15);car.rotation.y=Math.PI*.5;
const carBody=new THREE.Mesh(new THREE.BoxGeometry(4.2,.75,1.8),new THREE.MeshStandardMaterial({color:0x3b7ec3,metalness:.18,roughness:.3}));carBody.castShadow=true;car.add(carBody);
for(const wx of [-1.5,1.5]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,18),mats.dark);wh.rotation.z=Math.PI/2;wh.position.set(wx,-.48,-.68);car.add(wh);const wh2=wh.clone();wh2.position.z=.68;car.add(wh2)}
box(2.1,.55,1.3,7,.98,15,mats.window);

// Landmarks / interactions.
const landmarks=[
 {name:"帝國郵政",x:-24,z:-15,desc:"黃名帝國的公共郵政與資訊服務地標。"},
 {name:"皇家音樂廳",x:-42,z:1,desc:"國家音樂與典禮演出的文化場館。"},
 {name:"司憲院",x:-62,z:-9,desc:"黃名帝國司法與憲制相關歷史展示。"},
 {name:"歷史檔案館",x:24,z:-15,desc:"保存帝國歷史文件與重要文獻。"},
 {name:"文化交流館",x:42,z:1,desc:"文化與國際交流主題展覽。"},
 {name:"帝國圖書館",x:62,z:-9,desc:"帝國知識、出版與文化收藏。"},
 {name:"黃名歷史博物館",x:0,z:-54,desc:"中央博物館主入口。"}
];
for(const lm of landmarks){
 const marker=new THREE.Mesh(new THREE.TorusGeometry(.62,.08,10,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.82}));
 marker.rotation.x=-Math.PI/2;marker.position.set(lm.x,.16,lm.z);scene.add(marker);lm.marker=marker;
}

// Simple rectangular collision zones. No floating floors.
const solidZones=[
 [-32,-17,-16,-1],[-50,-34,-1,15],[-70,-54,-17,-1],
 [16,32,-16,-1],[34,50,-1,15],[54,70,-17,-1],
 [-14,14,-74,-57]
];
function blocked(x,z){
 if(x<-78||x>78||z<-82||z>42)return true;
 for(const a of solidZones)if(x>a[0]&&x<a[1]&&z>a[2]&&z<a[3])return true;
 return false;
}

function drawMap(){
 const c=document.getElementById("mapCanvas"),g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);
 g.fillStyle="#eef4f8";g.fillRect(0,0,c.width,c.height);
 g.fillStyle="#cfdce5";g.fillRect(48,0,58,c.height);g.fillRect(0,41,c.width,33);
 g.fillStyle="#d6b6bc";g.fillRect(4,8,35,26);g.fillRect(116,8,34,26);g.fillStyle="#bad1c2";g.fillRect(5,79,40,28);g.fillRect(112,78,39,29);
 g.fillStyle="#9bb3c3";for(const lm of landmarks){const px=77+lm.x*.72,py=57-lm.z*.72;g.beginPath();g.arc(px,py,2.6,0,Math.PI*2);g.fill()}
}
drawMap();

function updateMapDot(){
 const dot=document.getElementById("mapDot");
 dot.style.left=(77+avatar.position.x*.72)+"px";
 dot.style.top=(57-avatar.position.z*.72)+"px";
}
updateMapDot();

function setNight(v){
 night=v;
 scene.background=new THREE.Color(night?0x172747:0x9bc4e8);
 scene.fog.color=scene.background.clone();
 sun.intensity=night?.7:3;
 hemi.intensity=night?.75:2.1;
 fill.intensity=night?.22:.55;
 for(const lm of landmarks)lm.marker.material.opacity=night?.98:.82;
 document.getElementById("actNight").classList.toggle("active",night);
}
setNight(false);

function openExhibits(title="黃名歷史展區",text="探索街區中的博物館與歷史地標。"){
 document.getElementById("panelTitle").textContent=title;
 document.getElementById("panelText").textContent=text;
 const ex=document.getElementById("exhibits");ex.innerHTML="";
 for(const lm of landmarks){
   const d=document.createElement("div");d.className="exhibit";
   d.innerHTML="<b>"+lm.name+"</b><span>"+lm.desc+"</span>";
   d.onclick=()=>{avatar.position.set(lm.x,0,lm.z+6);document.getElementById("panel").classList.remove("on");};
   ex.appendChild(d);
 }
 document.getElementById("panel").classList.add("on");
}
document.getElementById("streetMode").onclick=()=>document.getElementById("panel").classList.remove("on");
document.getElementById("exhibitMode").onclick=()=>openExhibits();
document.getElementById("actInfo").onclick=()=>openExhibits();
document.getElementById("actMuseum").onclick=()=>openExhibits("黃名歷史博物館","從中央街道前往博物館主入口。");
document.getElementById("actNight").onclick=()=>setNight(!night);
document.getElementById("actReset").onclick=()=>{avatar.position.set(0,.02,26);yaw=0;pitch=.28};
document.getElementById("panelClose").onclick=()=>document.getElementById("panel").classList.remove("on");

window.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["Space","KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","KeyE"].includes(e.code))e.preventDefault();
 if(e.code==="KeyE"&&nearest)openExhibits(nearest.name,nearest.desc);
});
window.addEventListener("keyup",e=>keys[e.code]=false);

renderer.domElement.addEventListener("mousedown",e=>{dragging=true;lx=e.clientX;ly=e.clientY});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{if(!dragging)return;yaw-= (e.clientX-lx)*.006;pitch=Math.max(.08,Math.min(.72,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});

renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.pointerType==="mouse")return;
 if(e.clientX<170&&innerWidth<760)return;
 touchLook=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
 if(e.pointerId!==touchLook)return;
 yaw-=(e.clientX-lx)*.006;pitch=Math.max(.08,Math.min(.72,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;
});
renderer.domElement.addEventListener("pointerup",()=>touchLook=null);
renderer.domElement.addEventListener("pointercancel",()=>touchLook=null);

const joy=document.getElementById("joy"),stick=document.getElementById("stick");
let joyActive=false,joyId=null;
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,rad=38;
 if(len>rad){dx=dx/len*rad;dy=dy/len*rad}
 joystick.x=dx/rad;joystick.y=dy/rad;stick.style.transform="translate("+dx+"px,"+dy+"px)";
}
function joyStop(){joyActive=false;joyId=null;joystick.x=0;joystick.y=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{joyActive=true;joyId=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(joyActive&&e.pointerId===joyId)joyMove(e)});
joy.addEventListener("pointerup",joyStop);joy.addEventListener("pointercancel",joyStop);
document.getElementById("mobileJump").addEventListener("pointerdown",e=>{e.preventDefault();keys.Space=true;setTimeout(()=>keys.Space=false,120)});

function loop(){
 const dt=Math.min(clock.getDelta(),.04);
 let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joystick.x;
 let iz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joystick.y;
 let len=Math.hypot(ix,iz)||1;if(len>1){ix/=len;iz/=len}
 const speed=(keys.ShiftLeft||keys.ShiftRight?7:3.5)*dt;
 if(ix||iz){
   const nx=avatar.position.x+ix*speed,nz=avatar.position.z+iz*speed;
   if(!blocked(nx,avatar.position.z))avatar.position.x=nx;
   if(!blocked(avatar.position.x,nz))avatar.position.z=nz;
   avatar.rotation.y=yaw+Math.atan2(ix,iz);
   const walk=Math.sin(performance.now()*.012)*.17;
   armL.rotation.z=.15+walk;armR.rotation.z=-.15-walk;legL.rotation.x=walk*.8;legR.rotation.x=-walk*.8;
 }else{armL.rotation.z=.15;armR.rotation.z=-.15;legL.rotation.x=0;legR.rotation.x=0}
 if(keys.Space&&avatar.position.y<=.02){avatar.userData.vy=6.3}
 avatar.userData.vy=(avatar.userData.vy||0)-18*dt;avatar.position.y+=avatar.userData.vy*dt;
 if(avatar.position.y<.02){avatar.position.y=.02;avatar.userData.vy=0}
 const target=new THREE.Vector3(avatar.position.x,avatar.position.y+1.15,avatar.position.z);
 const dist=7.7,flat=dist*Math.cos(pitch),up=dist*Math.sin(pitch);
 const desired=new THREE.Vector3(target.x+Math.sin(yaw)*flat,target.y+up,target.z+Math.cos(yaw)*flat);
 camera.position.lerp(desired,Math.min(1,dt*8));
 camera.lookAt(target);

 nearest=null;
 let best=99;
 for(const lm of landmarks){
   const d=Math.hypot(lm.x-avatar.position.x,lm.z-avatar.position.z);
   const pulse=0.78+Math.sin(performance.now()*.003)*.12;
   lm.marker.scale.setScalar(pulse);
   if(d<4.5&&d<best){best=d;nearest=lm}
 }
 const pr=document.getElementById("prompt");
 if(nearest){pr.textContent="E  查看　"+nearest.name;pr.classList.add("show")}else pr.classList.remove("show");
 updateMapDot();

 // Little idle animation to make the city feel alive.
 car.position.y=.5+Math.sin(performance.now()*.0018)*.025;
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
