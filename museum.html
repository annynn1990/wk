function signTexture(title,sub,bg="#ffffff",fg="#264258",accent="#4a83bf"){
 const c=document.createElement("canvas");c.width=900;c.height=260;const g=c.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,900,260);g.fillStyle=accent;g.fillRect(0,0,900,20);g.fillStyle=fg;g.font='700 46px "Microsoft JhengHei",Arial';g.textAlign="center";g.fillText(title,450,110);g.fillStyle="#6a8192";g.font="20px Arial";g.fillText(sub,450,157);return new THREE.CanvasTexture(c)
}

}

function building(x,z,w,d,h,mat,title,sub,style="flat"){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(w,h,d,0,h/2,0,mat,0,g);
 const fz=-d/2-.045;

 }

 sm.position.set(0,Math.min(h-1.4,Math.max(2.5,h*.58)),fz-.055);sm.rotation.y=Math.PI;g.add(sm);
 collider(x-w/2-.6,x+w/2+.6,z-d/2-.2,z+d/2+.6);
 return g
}

const joy=document.getElementById("joy"),stick=document.getElementById("stick");let joyOn=false,joyId=null,joyX=0,joyY=0;
function joyMove(e){const r=joy.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),len=Math.hypot(dx0,dy0)||1,rad=38;let dx=dx0,dy=dy0;if(len>rad){dx=dx0/len*rad;dy=dy0/len*rad}joyX=dx/rad;joyY=dy/rad;stick.style.transform="translate("+dx+"px,"+dy+"px)"}
function joyStop(){joyOn=false;joyId=null;joyX=0;joyY=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{joyOn=true;joyId=e.pointerId;joy.setPointerCapture?.(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{if(joyOn&&e.pointerId===joyId)joyMove(e)});joy.addEventListener("pointerup",joyStop);joy.addEventListener("pointercancel",joyStop);
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();keys.Space=true;setTimeout(()=>keys.Space=false,140)});

function getFloorY(x,z){
 const lz=z+88;
 // stair landing: rise from ground to second floor
 if(x>-13.4&&x<-8.2&&lz>-2.8&&lz<3.2){
   return .03+((3.2-lz)/6.0)*5.25;
 }
 // upper galleries only after the stair / on the two wings
 if(lz>-6.2&&lz<5.9&&(x<-6.1||x>6.1)) return 5.45;
 return .03;
}
