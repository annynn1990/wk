<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>視覺化編輯｜黃名帝國維基百科</title>
<link rel="stylesheet" href="assets/wiki.css">
</head>
<body>
<header class="top"><a class="brand" href="./">黃名帝國維基百科</a><nav>
<a href="articles.html">所有條目</a><a href="categories.html">分類</a><a href="timeline.html">大事記</a><a href="about.html">關於</a><a href="edit.html">編輯</a>
</nav></header>

<main class="page visual-editor">
  <div class="ve-top card">
    <div><p class="eyebrow">WONGMING EMPIRE ENCYCLOPEDIA</p><h1>視覺化百科編輯器</h1><p class="muted">像排版百科頁面一樣編輯：把元件拖進文章、拖曳整個元件重新排序，內容直接在頁面上修改。</p></div>
    <div class="ve-actions">
      <select id="articleSelect"></select>
      <button class="button" id="reset">重新載入</button>
      <button class="primary" id="save">儲存並建立 Commit</button>
    </div>
  </div>

  <div class="ve-layout">
    <aside class="ve-sidebar">
      <section class="card palette">
        <h2>拖曳元件</h2>
        <p class="muted">把下面元件拖到文章中。</p>
        <div class="palette-item" draggable="true" data-type="p"><b>¶</b><span>段落</span></div>
        <div class="palette-item" draggable="true" data-type="h2"><b>H2</b><span>章節標題</span></div>
        <div class="palette-item" draggable="true" data-type="h3"><b>H3</b><span>小節標題</span></div>
        <div class="palette-item" draggable="true" data-type="quote"><b>❝</b><span>引用</span></div>
        <div class="palette-item" draggable="true" data-type="ul"><b>•</b><span>項目清單</span></div>
        <div class="palette-item" draggable="true" data-type="ol"><b>1.</b><span>編號清單</span></div>
        <div class="palette-item" draggable="true" data-type="hr"><b>―</b><span>分隔線</span></div>
        <div class="palette-item" draggable="true" data-type="table"><b>▦</b><span>表格</span></div>
        <div class="palette-item" draggable="true" data-type="infobox"><b>▤</b><span>資訊框</span></div>
      </section>
      <section class="card ve-settings">
        <h2>條目資料</h2>
        <label>標題<input id="title"></label>
        <label>摘要<textarea id="summary" rows="4"></textarea></label>
        <label>分類<input id="categories"></label>
      </section>
    </aside>

    <section class="ve-center">
      <div class="canvas-toolbar card">
        <button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button>
        <i></i><button data-cmd="createLink">🔗 連結</button><button data-cmd="insertUnorderedList">• 清單</button><button data-cmd="insertOrderedList">1. 清單</button>
        <i></i><button id="undo">↶</button><button id="redo">↷</button>
      </div>
      <div id="dropTop" class="drop-zone">拖到這裡新增元件</div>
      <article id="canvas" class="wiki-canvas"></article>
      <div id="dropBottom" class="drop-zone">＋ 把元件拖到文章最後</div>
    </section>

    <aside class="ve-preview card">
      <div class="preview-label">百科預覽</div>
      <article id="preview" class="article"></article>
    </aside>
  </div>

  <section class="notice"><strong>目前版本</strong><p id="status" class="muted">所有正文元素都是獨立元件，可以拖曳、複製、刪除與重新排序。</p></section>
</main>

<script src="assets/wiki.js"></script>
<script>
(async()=>{
 const articles=await load(), select=document.querySelector('#articleSelect'), canvas=document.querySelector('#canvas'), preview=document.querySelector('#preview');
 const title=document.querySelector('#title'),summary=document.querySelector('#summary'),categories=document.querySelector('#categories'),status=document.querySelector('#status');
 let current,dragged=null,dragType=null;
 select.innerHTML=articles.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.title)+'</option>').join('');

 const presets={
  p:'<p>開始輸入段落內容……</p>',h2:'<h2>新的章節</h2>',h3:'<h3>新的小節</h3>',
  quote:'<blockquote>輸入引用內容……</blockquote>',ul:'<ul><li>第一項</li><li>第二項</li></ul>',
  ol:'<ol><li>第一項</li><li>第二項</li></ol>',hr:'<hr>',
  table:'<table><thead><tr><th>欄位一</th><th>欄位二</th></tr></thead><tbody><tr><td>內容</td><td>內容</td></tr></tbody></table>',
  infobox:'<aside class="infobox"><h3>資訊框</h3><div><b>項目</b>：內容</div><div><b>項目</b>：內容</div></aside>'
 };

 function makeBlock(html){
  const el=document.createElement('div'); el.className='ve-block'; el.draggable=true;
  el.innerHTML='<div class="ve-handle" title="拖曳整個元件">⋮⋮</div><div class="ve-content" contenteditable="true"></div><div class="ve-tools"><button data-act="up">↑</button><button data-act="down">↓</button><button data-act="copy">⧉</button><button data-act="del">×</button></div>';
  el.querySelector('.ve-content').innerHTML=html;
  bind(el); return el;
 }
 function bind(el){
  const c=el.querySelector('.ve-content');
  c.addEventListener('input',sync); c.addEventListener('paste',()=>setTimeout(sync,0));
  el.addEventListener('dragstart',e=>{if(e.target.closest('.ve-tools')||e.target.closest('[contenteditable]')){e.preventDefault();return} dragged=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragged=null;clearDrops();sync()});
  el.addEventListener('dragover',e=>{e.preventDefault();if(!dragged&& !dragType)return;showDrop(el,e.clientY<el.getBoundingClientRect().top+el.offsetHeight/2)});
  el.addEventListener('drop',e=>{e.preventDefault();if(dragged&&dragged!==el){insertAround(el,e.clientY<el.getBoundingClientRect().top+el.offsetHeight/2,dragged)}else if(dragType){insertNew(el,e.clientY<el.getBoundingClientRect().top+el.offsetHeight/2,dragType)}clearDrops();sync()});
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(el,b.dataset.act));
 }
 function act(el,a){
  if(a==='del')el.remove();
  if(a==='copy'){const n=makeBlock(el.querySelector('.ve-content').innerHTML);el.after(n)}
  if(a==='up'&&el.previousElementSibling)el.parentNode.insertBefore(el,el.previousElementSibling);
  if(a==='down'&&el.nextElementSibling)el.parentNode.insertBefore(el.nextElementSibling,el);
  sync();
 }
 function insertAround(target,before,node){if(before)canvas.insertBefore(node,target);else canvas.insertBefore(node,target.nextSibling)}
 function insertNew(target,before,type){const n=makeBlock(presets[type]);insertAround(target,before,n);n.querySelector('.ve-content').focus()}
 function showDrop(el,before){clearDrops();el.classList.add(before?'drop-before':'drop-after')}
 function clearDrops(){document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'))}

 document.querySelectorAll('.palette-item').forEach(p=>{
  p.addEventListener('dragstart',e=>{dragType=p.dataset.type;dragged=null;e.dataTransfer.effectAllowed='copy'});
  p.addEventListener('dragend',()=>{dragType=null;clearDrops()});
 });
 function zone(zone,before){
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('active')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('active'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('active');if(dragged){before?canvas.insertBefore(dragged,canvas.firstChild):canvas.appendChild(dragged)}else if(dragType){const n=makeBlock(presets[dragType]);before?canvas.insertBefore(n,canvas.firstChild):canvas.appendChild(n);n.querySelector('.ve-content').focus()}dragged=null;dragType=null;sync()});
 }
 zone(document.querySelector('#dropTop'),true);zone(document.querySelector('#dropBottom'),false);

 function loadArticle(){
  current=articles.find(a=>a.id===select.value)||articles[0];title.value=current.title||'';summary.value=current.summary||'';categories.value=(current.categories||[]).join(', ');
  canvas.innerHTML='';const temp=document.createElement('div');temp.innerHTML=current.content||'<p>開始編輯本文……</p>';
  [...temp.childNodes].filter(n=>n.nodeType===1||(n.nodeType===3&&n.textContent.trim())).forEach(n=>canvas.appendChild(makeBlock(n.nodeType===1?n.outerHTML:'<p>'+esc(n.textContent)+'</p>')));
  sync();
 }
 function bodyHTML(){return [...canvas.querySelectorAll('.ve-content')].map(x=>x.innerHTML.trim()).filter(Boolean).join('\n')}
 function sync(){preview.innerHTML='<h1>'+esc(title.value.trim()||'未命名條目')+'</h1>'+bodyHTML()}
 title.oninput=sync;summary.oninput=sync;select.onchange=loadArticle;
 document.querySelectorAll('.canvas-toolbar [data-cmd]').forEach(b=>b.onclick=()=>{if(b.dataset.cmd==='createLink'){const u=prompt('輸入網址');if(u)document.execCommand('createLink',false,u)}else document.execCommand(b.dataset.cmd,false,null);sync()});
 document.querySelector('#undo').onclick=()=>{document.execCommand('undo');sync()};document.querySelector('#redo').onclick=()=>{document.execCommand('redo');sync()};
 document.querySelector('#reset').onclick=loadArticle;
 document.querySelector('#save').onclick=()=>{const next={...current,title:title.value.trim(),summary:summary.value.trim(),categories:categories.value.split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean),content:bodyHTML()};sessionStorage.setItem('wk-pending-json',JSON.stringify(articles.map(a=>a.id===current.id?next:a),null,2));window.open('https://github.com/annynn1990/wk/edit/main/data/articles.json','_blank','noopener');status.textContent='內容已整理完成；目前仍透過 GitHub 編輯頁提交。'};
 loadArticle();
})();
</script>
</body>
</html>
