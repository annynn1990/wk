name: Replace encyclopedia with MediaWiki

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-with-mediawiki:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download MediaWiki source
        run: git clone --depth 1 https://github.com/wikimedia/mediawiki.git /tmp/mediawiki

      - name: Replace repository contents
        run: |
          rsync -a --delete --exclude='.git' /tmp/mediawiki/ ./

      - name: Commit MediaWiki source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace encyclopedia with MediaWiki"
          git push origin HEAD:main
